name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies (if any)
        run: |
          if [ -f package.json ]; then
            npm ci
          fi

      - name: Install & build frontend
        run: |
          cd apps/frontend
          npm ci
          npm run build --if-present

      - name: Install & build CIE engine
        run: |
          cd engines/cie
          npm ci
          npm run build --if-present
